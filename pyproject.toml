[project]
name = "mcp-doorman"
version = "0.2.0"
description = "Secure-by-default FastAPI->MCP bridge. Deny-by-default exposure, scope->tool auth that fails closed (even on STDIO), built-in rate limiting, PII redaction at the source, and a structured audit log — in-process, no gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaxzodbek Qambaraliyev", email = "shaxzodbek@blaze.uz" }]
keywords = ["mcp", "fastapi", "model-context-protocol", "oauth", "security", "rate-limit", "pii-redaction", "audit", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
# Core stays dependency-light: the guard pipeline + all five guarantees need only
# pydantic-settings. The MCP/FastAPI transport is an optional, lazily-imported extra.
dependencies = [
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2", "starlette>=0.37"]
fastapi = ["fastapi>=0.110"]
all = ["mcp>=1.2", "starlette>=0.37", "fastapi>=0.110"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/shaxzodbek-uzb/mcp-doorman"
Repository = "https://github.com/shaxzodbek-uzb/mcp-doorman"
Issues = "https://github.com/shaxzodbek-uzb/mcp-doorman/issues"

[project.scripts]
mcp-doorman = "mcp_doorman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_doorman"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
